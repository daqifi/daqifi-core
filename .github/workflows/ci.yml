name: CI

on:
  pull_request:
    branches: [ main ]
  # Required for the merge queue. A queued PR is tested on a merge_group ref that
  # contains main's tip plus everything ahead of it in the queue — the state the
  # commit will actually land in, which a pull_request run cannot see. Without this
  # trigger the required "build" check never reports for a merge group and every
  # queued PR sits until it is timed out of the queue.
  merge_group:

  # Backstop only. The queue tests the real post-merge state, but main can still
  # move without passing through a queue (a ruleset bypass, an admin push).
  push:
    branches: [ main ]

# Cancel only pull_request runs. A merge_group run is the gate for a commit about
# to land, and a push run on main is the backstop above — neither is redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Push runs only. A PR that lands through the merge queue is fast-forwarded onto main
  # at the exact commit its merge_group run tested, so the push run that follows would
  # test the same SHA - the same tree, this same workflow file - a second time. That was
  # 46 of the 50 pushes measured in Nov 2026 (~16% of CI's runner minutes), and the only
  # push failures in that window were flakes on SHAs the queue had already passed.
  #
  # The backstop still does its job: a push the queue did not test (a ruleset bypass, an
  # admin push) has no green merge_group run for its SHA and gets the full matrix. Any
  # failure to answer the question - an API error, an unexpected response - also runs
  # the full matrix; only a positive match skips it.
  queue-verified:
    name: queue-verified
    if: github.event_name == 'push'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
    - name: Look for a green merge_group run of this exact commit
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.sha }}
      run: |
        count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=merge_group&status=success&head_sha=${SHA}" \
          --jq '[.workflow_runs[] | select(.head_sha == env.SHA)] | length' || echo 0)
        echo "green merge_group runs for ${SHA}: ${count}"
        if [ "${count}" -ge 1 ] 2>/dev/null; then
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "The merge queue already passed ${SHA}; skipping the duplicate test matrix." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "verified=false" >> "$GITHUB_OUTPUT"
        fi

  # One leg per supported OS. The library branches on the host OS (macOS IOKit HID,
  # Windows PnP/WMI discovery). fail-fast is off so one platform's failure still
  # leaves the other two's results readable.
  test:
    name: test
    needs: queue-verified
    # queue-verified is skipped on pull_request and merge_group, which would skip this
    # job too under the default success() condition; !cancelled() lets it run. A failed
    # queue-verified leaves `verified` empty, which also runs the matrix.
    if: ${{ !cancelled() && needs.queue-verified.outputs.verified != 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x

    # setup-dotnet's own `cache: true` keys off packages.lock.json, which this repo
    # does not use, so cache the package folder directly. Keyed by OS because the
    # restored graph differs per platform, and by the project files because that is
    # what decides which packages get pulled.
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore Daqifi.Core.sln

    - name: Build
      run: dotnet build -c Release --no-restore Daqifi.Core.sln

    # --no-build because the step above already built it. Coverage is collected
    # in-process at load time, so --no-build does not affect it. This step fails
    # only on a test failure.
    - name: Test
      run: dotnet test -c Release --no-build --no-restore Daqifi.Core.sln

    # Deliberately a failure, not a warning: an out-of-date baseline silently narrows
    # the ApiCompat check below (CONTRIBUTING.md), so this goes red after a release
    # until the baseline bump lands.
    #
    # Stable versions only. A prerelease is not what a consumer restores by default,
    # so it must not become the baseline. Filtering also keeps the baseline a plain
    # three-part version, which PublicApiTrackingTests asserts.
    - name: Check the package validation baseline is the latest published version
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        baseline=$(dotnet msbuild src/Daqifi.Core/Daqifi.Core.csproj \
          -getProperty:PackageValidationBaselineVersion -p:TargetFramework=net10.0 | tr -d '[:space:]')
        latest=$(curl -sSf https://api.nuget.org/v3-flatcontainer/daqifi.core/index.json \
          | jq -r '[.versions[] | select(contains("-") | not)] | last')
        echo "baseline=$baseline latest=$latest"
        if [ -z "$latest" ] || [ "$latest" = "null" ]; then
          echo "::error::Could not resolve a stable published version of Daqifi.Core from nuget.org."
          exit 1
        fi
        if [ "$baseline" != "$latest" ]; then
          echo "::error::PackageValidationBaselineVersion is $baseline but Daqifi.Core $latest is published." \
               "Everything added since $baseline is outside the ApiCompat comparison." \
               "Bump it in src/Daqifi.Core/Daqifi.Core.csproj."
          exit 1
        fi

    # Second half of the public-API guard (CONTRIBUTING.md): RS0016/RS0017 compare the
    # code to PublicAPI.*.txt, which a PR can edit; this compares the package to the
    # release on nuget.org, which no PR can edit.
    #
    # `--no-build` is absent on purpose: it skips the ApiCompat targets, so a pack
    # that uses it validates nothing. release.yml packs `--no-build` (to keep the
    # git-tag version stamp) and is not this gate.
    #
    # Ubuntu only: the packaged shape is identical on every leg. `dotnet pack`
    # defaults to Release, the configuration the Build step compiled, so it still
    # runs the build targets (and ApiCompat) but skips recompiling Daqifi.Core.
    # The package is thrown away; only the validation result matters.
    - name: Validate packaged API against the last published release
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack src/Daqifi.Core/Daqifi.Core.csproj --no-restore --output "${{ runner.temp }}/api-validation"

    # Reports already exist from the test step. Reporting only — no coverage
    # threshold that can fail the job. `always()` so a red test run still publishes
    # whatever coverage was written before the failure.
    - name: Coverage summary
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        # The collector names every report coverage.cobertura.xml and buries it under a
        # per-run GUID directory, so the framework it belongs to is only knowable from the
        # path: src/coverage/<tfm>/<run guid>/coverage.cobertura.xml (see the results
        # directory Daqifi.Core.Tests.csproj sets). Flatten to the framework-labelled names
        # the summary and the uploaded artifact have always used.
        #
        # A failed move degrades to a warning and a report missing from the summary. This step
        # runs under `set -e`, so letting one abort the step would let coverage fail an
        # otherwise green leg.
        for report in src/coverage/*/*/coverage.cobertura.xml; do
          framework=$(basename "$(dirname "$(dirname "$report")")")
          mv -f "$report" "src/coverage/coverage.$framework.cobertura.xml" \
            || echo "::warning::Could not move $report into place; $framework will be missing from the coverage summary."
        done

        # Losing one framework's report and not the other's is otherwise invisible: the table
        # simply renders a row short. The expected list is read from the test project rather
        # than repeated here, so it cannot drift from the frameworks the tests actually run on.
        expected=$(sed -n 's:.*<TargetFrameworks>\(.*\)</TargetFrameworks>.*:\1:p' src/Daqifi.Core.Tests/Daqifi.Core.Tests.csproj | tr ';' ' ' || true)
        for framework in $expected; do
          test -f "src/coverage/coverage.$framework.cobertura.xml" \
            || echo "::warning::No coverage report was produced for $framework."
        done

        reports=(src/coverage/*.cobertura.xml)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "No coverage reports were produced by this run." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python_bin=python3
        command -v python3 >/dev/null 2>&1 || python_bin=python
        "$python_bin" .github/scripts/coverage-summary.py "${reports[@]}"

    # Keyed by runner.os so the three legs upload three artifacts instead of
    # colliding on one name. Each leg's numbers differ: the OS-specific transports
    # only execute on the platform they are written for.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ runner.os }}
        path: src/coverage/*.cobertura.xml
        if-no-files-found: warn

  # The matrix legs report as "test (ubuntu-latest)" and friends, so branch
  # protection and the merge queue would lose the check they require. This job keeps
  # the old "build" name and passes only when every leg passed, so the required
  # check keeps reporting and automatically covers any OS added to the matrix later.
  build:
    name: build
    needs: [queue-verified, test]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - name: Check matrix result
      env:
        RESULT: ${{ needs.test.result }}
        VERIFIED: ${{ needs.queue-verified.outputs.verified }}
      run: |
        echo "Matrix result: $RESULT (queue-verified: ${VERIFIED:-n/a})"
        # The one sanctioned skip: a push whose exact commit the merge queue already
        # passed. Anything else other than success — a failed leg, a cancelled leg, or a
        # leg skipped by a bad `if` — must not report green.
        if [ "$RESULT" = "skipped" ] && [ "$VERIFIED" = "true" ]; then
          exit 0
        fi
        [ "$RESULT" = "success" ]
