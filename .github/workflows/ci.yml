name: CI

on:
  pull_request:
    branches: [ main ]
  # Required for the merge queue. A queued PR is tested on a merge_group ref that
  # contains main's tip plus everything ahead of it in the queue — the state the
  # commit will actually land in, which a pull_request run cannot see. Without this
  # trigger the required "build" check never reports for a merge group and every
  # queued PR sits until it is timed out of the queue.
  merge_group:

  # Backstop only. The queue tests the real post-merge state, so this should not be
  # what catches a break — but main can still move without passing through a queue
  # (a ruleset bypass, an admin push), and #444/#445 showed how expensive an
  # unnoticed red main is: five later PRs failed on inherited breakage, and CI that
  # only ran on pull_request had no run on main to point at.
  push:
    branches: [ main ]

# Superseded pushes to a PR branch used to keep running to completion; with three
# runners per run that waste is now tripled, so cancel them. Only pull_request runs
# are cancelled: a merge_group run is the gate for a commit that is about to land,
# and a push run on main is the backstop above — neither is ever redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per supported OS (#635). The library branches on the host OS in a dozen
  # files — the macOS IOKit HID transport, the Windows PnP/WMI discovery providers —
  # and until now the first machine to compile any of that was a user's.
  # fail-fast is off so one platform's failure still leaves the other two's results
  # readable, which is the whole point of having them.
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    # setup-dotnet's own `cache: true` keys off packages.lock.json, which this repo
    # does not use, so cache the package folder directly. Keyed by OS because the
    # restored graph differs per platform, and by the project files because that is
    # what decides which packages get pulled.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore Daqifi.Core.sln

    - name: Build
      run: dotnet build --no-restore Daqifi.Core.sln

    # --no-build because the step above already built it. Without that flag every
    # leg compiled the solution a second time, which the matrix would have tripled.
    # Coverage rides along with this run: Daqifi.Core.Tests.csproj asks for the
    # in-process collector, which instruments at load time and so is unaffected by
    # --no-build. This step can now only fail on a test failure — the post-test
    # MSBuild step that used to fail it after a fully green run is gone (#689).
    - name: Test
      run: dotnet test --no-build --no-restore Daqifi.Core.sln

    # The baseline is only as good as it is current. ApiCompat can only report a
    # member the baseline package actually contains, so every API added since the
    # pinned version sits outside the comparison - an out-of-date baseline is a
    # narrower check, not a stricter one, and the step below would keep passing
    # while covering less and less. Bumping it is part of cutting a release
    # (CONTRIBUTING.md); this is what makes forgetting visible instead of silent.
    #
    # Deliberately a failure, not a warning: after a release is published this
    # goes red until the bump lands, which is the point. It costs one unauthenticated
    # HTTP request to the index the pack step already downloads from.
    #
    # Stable versions only. release.yml accepts prerelease tags (`1.8.0-beta.1`),
    # and the flat-container index lists them alongside the rest - but a prerelease
    # is not what a consumer restores by default, so it must not become the
    # baseline every other PR is then required to match. Filtering them here is
    # also what keeps the baseline parseable as a plain three-part version, which
    # PublicApiTrackingTests asserts.
    - name: Check the package validation baseline is the latest published version
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        baseline=$(dotnet msbuild src/Daqifi.Core/Daqifi.Core.csproj \
          -getProperty:PackageValidationBaselineVersion -p:TargetFramework=net10.0 | tr -d '[:space:]')
        latest=$(curl -sSf https://api.nuget.org/v3-flatcontainer/daqifi.core/index.json \
          | jq -r '[.versions[] | select(contains("-") | not)] | last')
        echo "baseline=$baseline latest=$latest"
        if [ -z "$latest" ] || [ "$latest" = "null" ]; then
          echo "::error::Could not resolve a stable published version of Daqifi.Core from nuget.org."
          exit 1
        fi
        if [ "$baseline" != "$latest" ]; then
          echo "::error::PackageValidationBaselineVersion is $baseline but Daqifi.Core $latest is published." \
               "Everything added since $baseline is outside the ApiCompat comparison." \
               "Bump it in src/Daqifi.Core/Daqifi.Core.csproj."
          exit 1
        fi

    # The public API surface is guarded twice (issue #636). RS0016/RS0017 guard it
    # at compile time against the checked-in PublicAPI.*.txt, which the Build step
    # above already covers - but those files are part of the PR, so a PR that
    # deletes an entry and the member together compiles clean. This step is the
    # second half: it compares the packaged assemblies against what Daqifi.Core
    # actually published to nuget.org (the baseline version in Daqifi.Core.csproj),
    # which a PR cannot edit, and fails on a member the baseline had.
    #
    # `--no-build` is deliberately absent: it skips the ApiCompat targets outright,
    # so a pack that uses it validates nothing. That is also why release.yml's pack
    # is not the gate - it packs `--no-build` so the assemblies keep the version
    # stamped from the git tag. Everything reaching a release tag has passed this
    # step first, on the PR and again on main.
    #
    # Ubuntu only: the packaged shape is identical on all three legs, so the other
    # two would pay to compute the same answer. `dotnet pack` defaults to Release,
    # so this does compile Daqifi.Core once more rather than reusing the Debug
    # output above - one project, a few seconds, on one leg. The package itself is
    # thrown away; only the validation result matters.
    - name: Validate packaged API against the last published release
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack src/Daqifi.Core/Daqifi.Core.csproj --no-restore --output "${{ runner.temp }}/api-validation"

    # Daqifi.Core.Tests.csproj collects coverage on every run, so the cobertura
    # reports already exist by this point; the next two steps are only about not
    # throwing them away when the job ends. Reporting only — deliberately no
    # threshold that can fail the build (#641). `always()` so a red test run still
    # publishes whatever coverage was written before the failure.
    - name: Coverage summary
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        # The collector names every report coverage.cobertura.xml and buries it under a
        # per-run GUID directory, so the framework it belongs to is only knowable from the
        # path: src/coverage/<tfm>/<run guid>/coverage.cobertura.xml (see the results
        # directory Daqifi.Core.Tests.csproj sets). Flatten to the framework-labelled names
        # the summary and the uploaded artifact have always used.
        #
        # A failed move degrades to a warning and a report missing from the summary. This step
        # runs under `set -e`, so letting one abort the step would put coverage back in a
        # position to fail an otherwise green leg — the whole point of #689.
        for report in src/coverage/*/*/coverage.cobertura.xml; do
          framework=$(basename "$(dirname "$(dirname "$report")")")
          mv -f "$report" "src/coverage/coverage.$framework.cobertura.xml" \
            || echo "::warning::Could not move $report into place; $framework will be missing from the coverage summary."
        done

        # Losing one framework's report and not the other's is otherwise invisible: the table
        # simply renders a row short. The expected list is read from the test project rather
        # than repeated here, so it cannot drift from the frameworks the tests actually run on.
        expected=$(sed -n 's:.*<TargetFrameworks>\(.*\)</TargetFrameworks>.*:\1:p' src/Daqifi.Core.Tests/Daqifi.Core.Tests.csproj | tr ';' ' ' || true)
        for framework in $expected; do
          test -f "src/coverage/coverage.$framework.cobertura.xml" \
            || echo "::warning::No coverage report was produced for $framework."
        done

        reports=(src/coverage/*.cobertura.xml)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "No coverage reports were produced by this run." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python_bin=python3
        command -v python3 >/dev/null 2>&1 || python_bin=python
        "$python_bin" .github/scripts/coverage-summary.py "${reports[@]}"

    # Keyed by runner.os so the three legs upload three artifacts instead of
    # colliding on one name. Each leg's numbers differ: the OS-specific transports
    # only execute on the platform they are written for.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ runner.os }}
        path: src/coverage/*.cobertura.xml
        if-no-files-found: warn

  # The matrix legs report as "test (ubuntu-latest)" and friends, so branch
  # protection and the merge queue would lose the check they require. This job keeps
  # the old "build" name and passes only when every leg passed, so the required
  # check keeps reporting and automatically covers any OS added to the matrix later.
  build:
    name: build
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check matrix result
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "Matrix result: $RESULT"
        # Anything other than success — a failed leg, a cancelled leg, or a leg
        # skipped by a bad `if` — must not report green.
        [ "$RESULT" = "success" ]
